[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nativelayout"
version = "1.2.4"
description = "Create native interfaces from HTML, in any language. Python core and Kivy host."
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adilson C. Rafael" }]
keywords = ["ui", "layout", "html", "css", "native", "kivy", "android"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
# the core is pure Python and has no dependencies
dependencies = []

[project.optional-dependencies]
# the Kivy host (nativelayout.host)
kivy = ["kivy>=2.0"]

[project.urls]
Homepage = "https://getnativelayout.github.io/nativelayout/"
Source = "https://github.com/getnativelayout/nativelayout"
Issues = "https://github.com/getnativelayout/nativelayout/issues"
Specification = "https://github.com/getnativelayout/nativelayout/blob/main/SPEC.md"

# The core and the host live in separate folders of the repository, so they are mapped here.
# `nativelayout/__init__.py` joins them with pkgutil.extend_path when they are used from the repository.
[tool.setuptools]
packages = ["nativelayout", "nativelayout.core", "nativelayout.host"]

[tool.setuptools.package-dir]
"nativelayout" = "core/nativelayout"
"nativelayout.core" = "core/nativelayout/core"
"nativelayout.host" = "android/nativelayout/host"
