name: Pad (web build)

on:
  push:
    branches: [main]
    paths:
      - "android/core/**"
      - "web/**"
      - ".github/workflows/pad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Compile the core to JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build nlweb.js
        run: gradle -p web jsBrowserProductionWebpack
      - name: Copy it to pad/
        run: |
          set -euo pipefail
          mkdir -p pad
          cp web/build/kotlin-webpack/js/productionExecutable/nlweb.js pad/nlweb.js
          ls -l pad
      - uses: actions/upload-artifact@v4
        with:
          name: nativelayoutpad
          path: pad/
      - name: Commit pad/nlweb.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pad/nlweb.js
          git diff --cached --quiet || (git commit -m "pad: rebuild nlweb.js [skip ci]" && git push)
