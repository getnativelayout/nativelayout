name: Python

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        working-directory: python
        run: |
          python -m compileall -q core/nativelayout
          python -m compileall -q android/nativelayout desktop/nativelayout

      - name: Core tests
        working-directory: python/core
        run: python -m unittest discover -s tests -t . -v

      - name: Host tests (flex.py, no Kivy)
        working-directory: python/android
        run: python -m unittest discover -s tests -t . -v
