name: apk

# Run by hand: Actions > apk > Run workflow, and choose the example.
# A first build takes 20 to 40 minutes; the next ones use the cache.
on:
  workflow_dispatch:
    inputs:
      example:
        description: "Example to build"
        required: true
        default: despesas
        type: choice
        options:
          - despesas
          - teclado

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer
        run: pip install --upgrade buildozer "cython<3" virtualenv

      - name: Cache the Android tools
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-ndk-25b-p4a-2024.01.21

      - name: Build the APK
        working-directory: python/examples/${{ inputs.example }}
        run: buildozer -v android debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.example }}-apk
          path: python/examples/${{ inputs.example }}/bin/*.apk
