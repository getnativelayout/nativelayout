name: Publish Python

# Publishes python/ to PyPI when a tag like python-v1.2.0 is pushed.
# Uses PyPI Trusted Publishing: no token is stored in the repository.

on:
  push:
    tags:
      - "python-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Core tests
        working-directory: python/core
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        working-directory: python
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
